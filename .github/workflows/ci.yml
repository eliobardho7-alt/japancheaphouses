name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies, so this job
      # also fails if the lockfile drifts out of sync with package.json.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Fail only on what can actually be exploited in the deployed site.
      # Everything that ships to a visitor is a production dependency, so this
      # gate stays strict.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build tooling (tailwind, eslint-config-next and their transitives)
      # regularly carries advisories whose only fix is a major upgrade of the
      # framework. Those are worth seeing, but blocking every deploy on an
      # upstream release nobody here controls just trains people to ignore CI.
      # Reported, never fatal.
      - name: Report dev dependency advisories
        run: npm audit --audit-level=high || true
        continue-on-error: true
